name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra dev
      - name: Match tag to package version
        run: uv run python -c 'import os, csvview; assert os.environ["GITHUB_REF_NAME"] == "v" + csvview.__version__'
      - run: uv build
      - name: Write artifact checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "csvview $GITHUB_REF_NAME" --generate-notes
