[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csvview"
dynamic = ["version"]
description = "Open CSV files in a fast local browser UI backed by DuckDB."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["csv", "duckdb", "viewer", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = ["duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/alexey-rgc/csvview"
Repository = "https://github.com/alexey-rgc/csvview"
Issues = "https://github.com/alexey-rgc/csvview/issues"
Changelog = "https://github.com/alexey-rgc/csvview/blob/main/docs/CHANGES.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
csvview = "csvview.cli:main"

[tool.hatch.version]
path = "src/csvview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/csvview"]
include = ["src/csvview/**/*.py", "src/csvview/static/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "AGENTS.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
