<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>csvview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3.5' fill='%230E7A72'/%3E%3Cpath d='M4 5.5h8M4 8.5h8M4 11h5' stroke='white' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
  try {
    var t = JSON.parse(localStorage.getItem('csvview.theme'));
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/grid.css">
<link rel="stylesheet" href="/static/css/panels.css">
<script type="module" src="/static/js/app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="csvview">
    <svg class="brand-mark" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
      <rect x="1" y="1" width="14" height="14" rx="3.5"></rect>
      <path d="M4 5.5h8M4 8.5h8M4 11h5"></path>
    </svg>
    <span class="brand-name">csvview</span>
  </div>
  <nav class="tabs" id="tabs" aria-label="Tables and query results"></nav>
  <div class="topbar-actions">
    <button class="btn" id="open-btn" type="button" title="Open a CSV file">
      <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5M3 13h10"></path></svg>
      <span class="btn-label">Open CSV</span>
    </button>
    <label class="search">
      <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
      <input id="search" type="text" placeholder="Search all columns" spellcheck="false" autocomplete="off" aria-label="Search all columns">
      <kbd class="search-key">/</kbd>
    </label>
    <button class="btn" id="sql-btn" type="button" aria-pressed="false" title="Toggle SQL panel">
      <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m5 4.5-3 3.5 3 3.5M11 4.5l3 3.5-3 3.5M9.2 3 6.8 13"></path></svg>
      <span class="btn-label">SQL</span>
    </button>
    <button class="btn" id="export-btn" type="button" title="Download the current view as CSV">
      <svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v8M4.5 7.5 8 11l3.5-3.5M3 13h10"></path></svg>
      <span class="btn-label">Export</span>
    </button>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch light or dark theme" title="Switch theme">
      <svg class="icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="5.5"></circle><path class="fill" d="M8 2.5a5.5 5.5 0 0 1 0 11z"></path></svg>
    </button>
    <button class="icon-btn" id="help-btn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">?</button>
  </div>
</header>

<section class="sql-panel" id="sql-panel" aria-label="SQL editor" hidden></section>

<main class="main">
  <div class="grid-wrap">
    <div id="grid"></div>
    <div class="no-rows" id="no-rows" hidden>
      <p>No rows match the current filters.</p>
      <button class="btn" id="no-rows-clear" type="button">Clear filters and search</button>
    </div>
    <div class="empty" id="empty" hidden>
      <div class="empty-zone">
        <svg class="empty-mark" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
          <rect x="6" y="8" width="36" height="32" rx="5"></rect>
          <path d="M6 17h36M18 17v23M30 17v23M6 26h36M6 33h36"></path>
        </svg>
        <h1>Drop a CSV file here</h1>
        <p>It loads into an in-memory database on this machine. Nothing leaves your computer.</p>
        <button class="btn btn-primary" id="empty-open" type="button">Choose a file</button>
        <p class="empty-hint">Or start from a terminal: <code>csvview data.csv</code></p>
      </div>
    </div>
  </div>
  <aside class="inspector" id="inspector" aria-label="Column inspector" hidden></aside>
  <aside class="drawer" id="drawer" aria-label="Row details" hidden></aside>
</main>

<footer class="statusbar" id="statusbar"></footer>

<input type="file" id="file-input" accept=".csv,.tsv,.txt,.csv.gz,text/csv,text/tab-separated-values" multiple hidden>
<div class="drop-overlay" id="drop-overlay" hidden>
  <div class="drop-card">
    <svg class="icon" viewBox="0 0 16 16" width="28" height="28" aria-hidden="true"><path d="M8 3v8M4.5 7.5 8 11l3.5-3.5M3 13h10"></path></svg>
    <span>Drop to open</span>
  </div>
</div>
<div class="modal" id="shortcuts" hidden></div>
</body>
</html>
